{% extends "base.html" %}{% block title %}Nova senha | Forno da Vila{% endblock %} {% block content %}
<section class="auth-page">
  <div class="auth-decoration">🍕</div>
  <form class="auth-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <span class="eyebrow">RECUPERAÇÃO DE ACESSO</span>
    <h1>Crie uma nova senha</h1>
    <p>Escolha uma senha com 8 a 256 caracteres.</p>
    <label>
      Nova senha
      <input
        type="password"
        name="senha"
        required
        minlength="8"
        maxlength="256"
        autocomplete="new-password"
      />
    </label>
    <label>
      Confirme a nova senha
      <input
        type="password"
        name="confirmacao"
        required
        minlength="8"
        maxlength="256"
        autocomplete="new-password"
      />
    </label>
    <button class="btn btn-primary btn-block">Alterar senha</button>
  </form>
</section>
{% endblock %}
